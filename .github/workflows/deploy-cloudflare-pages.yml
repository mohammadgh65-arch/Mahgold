name: Mahgold Cloudflare Pages production deploy

on:
  push:
    branches:
      - fix/admin-order-state-guard-2026-11-22
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mahgold-pages-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Verify and publish Mahgold
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build production storefront and admin
        env:
          VITE_SUPABASE_URL: https://nzvvvpbwavaodhxrnkdr.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_8UgFkQuDJNNeez2O1CNv3Q_Jf44PrL9
        run: npm run build
      - name: Verify output and security headers
        run: |
          test -s dist/index.html
          test -s dist/_headers
          test -s dist/_redirects
          grep -q 'Strict-Transport-Security' dist/_headers
          grep -q 'X-Content-Type-Options' dist/_headers
          ! grep -R 'growth-and-advancement-garden.lovable.app' dist
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 8bf2b95b3799fcf1679ff23dd19d2a8d
        run: npx --yes wrangler@4 pages deploy dist --project-name mahgold-v102-preview --branch fix/admin-order-state-guard-2026-11-22
