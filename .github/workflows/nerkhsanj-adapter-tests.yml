name: Experimental NerkhSanj adapter tests

on:
  push:
    branches:
      - "experiment/**"
    paths:
      - "experimental/nerkhsanj-rate-adapter.ts"
      - "experimental/nerkhsanj-rate-adapter.test.ts"
      - ".github/workflows/nerkhsanj-adapter-tests.yml"
  pull_request:
    paths:
      - "experimental/nerkhsanj-rate-adapter.ts"
      - "experimental/nerkhsanj-rate-adapter.test.ts"
      - ".github/workflows/nerkhsanj-adapter-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Deno unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run adapter tests
        run: deno test experimental/nerkhsanj-rate-adapter.test.ts
