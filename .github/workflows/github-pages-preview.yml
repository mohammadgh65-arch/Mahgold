name: Deploy Mahgold HTML storefront and authenticated admin panel

on:
  push:
    branches:
      - github-pages-preview
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-preview
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages-preview
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Set up Node.js for standalone admin build
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Build authenticated admin-only panel
        env:
          VITE_ADMIN_PREVIEW: "true"
          VITE_SUPABASE_URL: https://nzvvvpbwavaodhxrnkdr.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_8UgFkQuDJNNeez2O1CNv3Q_Jf44PrL9
        run: |
          npm run build
          node scripts/create-standalone-preview.mjs
          test -s dist/index.html
          grep -q 'ورود مدیریت مه‌گلد' dist/index.html
          grep -q 'نمای کلی' dist/index.html
          mkdir -p dist/admin
          cp dist/index.html dist/admin/index.html
          cp public/mahgold-logo.webp dist/admin/mahgold-logo.webp
          sed -i 's#</head>#<meta name="robots" content="noindex,nofollow"></head>#' dist/admin/index.html

      - name: Prepare the approved standalone storefront
        run: |
          cp Mahgold_Footer_Premium_Quality.html dist/index.html
          cp Mahgold_Footer_Premium_Quality.html dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy storefront and admin panel
        id: deployment
        uses: actions/deploy-pages@v4
