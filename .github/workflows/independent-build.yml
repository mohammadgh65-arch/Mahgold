name: Independent storefront build

on:
  push:
    branches:
      - mahgold-independent-react
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Create lockfile and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout independent branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate and commit npm lockfile when missing
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: add npm lockfile"
            git push origin HEAD:mahgold-independent-react
          fi
      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build Vite application
        run: npm run build
