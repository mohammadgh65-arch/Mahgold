name: Independent storefront build and private preview artifact

on:
  push:
    branches:
      - mahgold-independent-react
      - mahgold-production-hardening-20261123
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build standalone private preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout independent branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Commit synchronized npm lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'chore: synchronize npm lockfile'
            git push
          fi
      - name: Verify clean lockfile installation
        run: npm ci --no-audit --no-fund
      - name: Build React application
        env:
          VITE_SUPABASE_URL: https://nzvvvpbwavaodhxrnkdr.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_8UgFkQuDJNNeez2O1CNv3Q_Jf44PrL9
        run: npm run build
      - name: Assemble standalone HTML
        run: node scripts/create-standalone-preview.mjs
      - name: Verify standalone output
        run: |
          test -s dist/index.html
          ! grep -Eq '<script[^>]+src=.*assets/|<link[^>]+href=.*assets/.*\.css' dist/index.html
          grep -q 'data:image/svg+xml;base64' dist/index.html
          echo "Standalone HTML verified: $(wc -c < dist/index.html) bytes"
      - name: Upload private preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: mahgold-private-preview
          path: |
            dist/index.html
            package-lock.json
          if-no-files-found: error
          retention-days: 14
