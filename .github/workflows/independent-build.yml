name: Independent storefront build and private preview artifact

on:
  push:
    branches:
      - mahgold-independent-react
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build standalone private preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout independent branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build React application
        run: npm run build
      - name: Assemble standalone HTML
        run: node scripts/create-standalone-preview.mjs
      - name: Verify standalone output
        run: |
          test -s dist/index.html
          ! grep -Eq '<script[^>]+src=|<link[^>]+\.css' dist/index.html
          grep -q 'data:image/webp;base64' dist/index.html
          echo "Standalone HTML verified: $(wc -c < dist/index.html) bytes"
      - name: Upload private preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: mahgold-private-preview
          path: dist/index.html
          if-no-files-found: error
          retention-days: 14
