name: Regenerate and validate Mahgold lockfile
on:
  push:
    branches: [fix/lockfile-regeneration-20261128]
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate lockfile from package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean reproducible install
        run: npm ci --no-audit --no-fund
      - name: Verify production build
        run: npm run build
      - name: Commit generated lockfile on isolated branch
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "fix: regenerate package lock for independent build"
            git push
          else
            echo "Lockfile already matches package.json."
          fi
