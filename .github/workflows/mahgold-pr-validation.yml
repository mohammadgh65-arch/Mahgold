name: Mahgold pull request validation

on:
  pull_request:
    branches:
      - mahgold-canonical-20261125
  push:
    branches:
      - mahgold-canonical-20261125

permissions:
  contents: read

concurrency:
  group: mahgold-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconcile lockfile in isolated CI workspace
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Clean install from reconciled lock
        run: npm ci --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: Export reconciled lockfile for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mahgold-reconciled-package-lock
          path: package-lock.json
          retention-days: 7
