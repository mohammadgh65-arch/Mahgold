name: Encrypted Supabase Database Backup

on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * *" # daily 03:41 UTC

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg

      - name: Create encrypted database dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_SESSION_POOLER_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL" || { echo "Missing SUPABASE_SESSION_POOLER_URL secret"; exit 1; }
          test -n "$BACKUP_PASSPHRASE" || { echo "Missing BACKUP_ENCRYPTION_PASSPHRASE secret"; exit 1; }
          case "$SUPABASE_DB_URL" in
            postgres://*|postgresql://*) ;;
            *) echo "Secret format invalid: expected a PostgreSQL connection URI beginning postgres:// or postgresql://"; exit 1 ;;
          esac
          docker run --rm -e SUPABASE_DB_URL -v "$PWD:/backup" postgres:17 sh -ec 'pg_dump --dbname="$SUPABASE_DB_URL" --format=custom --no-owner --no-acl --verbose --file=/backup/mahgold.dump'
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" --symmetric --cipher-algo AES256 --output "mahgold-$(date -u +%Y-%m-%d).dump.gpg" mahgold.dump
          shred -u mahgold.dump || rm -f mahgold.dump

      - name: Store encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: mahgold-encrypted-db-backup-${{ github.run_id }}
          path: mahgold-*.dump.gpg
          retention-days: 7
          if-no-files-found: error
