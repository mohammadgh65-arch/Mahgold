name: Verify Mahgold MPA
on:
  push:
    branches: [mpa-staging-2026-11-24]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify page structure and required security gates
        run: |
          node scripts/verify-mpa.mjs
          for file in assets/*.mjs worker.js; do node --check "$file"; done
