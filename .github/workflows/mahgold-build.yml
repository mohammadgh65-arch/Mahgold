name: Mahgold build check

on:
  push:
    branches:
      - mahgold-admin-repair-2026-11-15
  pull_request:
    branches:
      - mahgold-admin-repair-2026-11-15
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mahgold-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Vite app
        run: npm run build
