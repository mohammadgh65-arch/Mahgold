name: Mahgold build check

on:
  push:
    branches:
      - mahgold-admin-repair-2026-11-15
      - fix/admin-order-state-guard-2026-11-22
  pull_request:
    branches:
      - mahgold-admin-repair-2026-11-15
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mahgold-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build Vite app
        run: npm run build
      - name: Verify GitHub Pages browser security policy
        run: |
          test -s dist/index.html
          grep -q 'http-equiv="Content-Security-Policy"' dist/index.html
          grep -q "script-src 'self'" dist/index.html
          ! grep -R 'growth-and-advancement-garden.lovable.app' dist
