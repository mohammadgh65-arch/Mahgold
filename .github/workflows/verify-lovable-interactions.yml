name: Verify Lovable storefront interactions (read-only)
on:
  push:
    branches:
      - mahgold-reference-inspection
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test live storefront without database writes
        run: |
          mkdir -p interaction-check
          cat > verify.cjs <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1365,height:950}});
            const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
            const result={checks:[],errors};
            const check=(name,ok,details={})=>result.checks.push({name,ok,...details});
            await page.goto('https://growth-and-advancement-garden.lovable.app/',{waitUntil:'networkidle',timeout:90000});
            await page.waitForTimeout(3000);
            check('Homepage renders',await page.locator('header').count()>0,{title:await page.title()});
            check('Live Supabase products loaded',await page.locator('button[aria-label^="افزودن"]').count()>0,{addButtons:await page.locator('button[aria-label^="افزودن"]').count()});
            await page.locator('button[aria-label^="افزودن"]').first().click();
            await page.locator('button[aria-label="سبد خرید"]').click();
            await page.waitForTimeout(500);
            check('Cart drawer opens and contains selected product',await page.getByText(/جمع سبد|سبد خرید/).count()>0,{visibleText:(await page.locator('body').innerText()).slice(-900)});
            await page.keyboard.press('Escape').catch(()=>{});
            const login=page.getByRole('button',{name:'ورود / ثبت‌نام'});
            if(await login.count()){await login.first().click();await page.waitForTimeout(500);}
            check('Customer auth dialog opens',await page.getByText(/ورود به حساب|ایجاد حساب|ورود / ثبت‌نام/).count()>0,{dialogs:await page.locator('[role="dialog"]').count()});
            await page.screenshot({path:'interaction-check/auth.png',fullPage:false});
            await page.goto('https://growth-and-advancement-garden.lovable.app/product/6d1995bc-960f-4a4d-a481-dc1ae18091ff',{waitUntil:'networkidle',timeout:90000});
            await page.waitForTimeout(1500);
            check('Product detail route renders',await page.locator('main').count()>0,{title:await page.title(),body:(await page.locator('body').innerText()).slice(0,1800)});
            await page.screenshot({path:'interaction-check/product-detail.png',fullPage:true});
            await page.goto('https://growth-and-advancement-garden.lovable.app/admin',{waitUntil:'networkidle',timeout:90000});
            await page.waitForTimeout(1500);
            check('Admin route is present and protected',/ورود|مدیریت|دسترسی|Admin/i.test(await page.locator('body').innerText()),{body:(await page.locator('body').innerText()).slice(0,1000)});
            await page.screenshot({path:'interaction-check/admin.png',fullPage:true});
            fs.writeFileSync('interaction-check/results.json',JSON.stringify(result,null,2));
            console.log(JSON.stringify(result,null,2));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node verify.cjs
      - name: Upload read-only checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lovable-interaction-check
          path: interaction-check/
          if-no-files-found: warn
          retention-days: 3
