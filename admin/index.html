/* Mahgold production polish — accessibility, mobile ergonomics and resilient layout */
:root{scroll-behavior:smooth;scroll-padding-top:88px}
:focus-visible{outline:3px solid #b58b45!important;outline-offset:3px}
button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}
button:disabled{cursor:not-allowed;opacity:.58;filter:saturate(.65)}
img{max-width:100%}
input,textarea,select{font:inherit}
::selection{background:#d8bd82;color:#1b211a}
@media(max-width:760px){
  .admin-shell{display:block}
  .admin-side{position:relative;top:auto;width:100%;height:auto;min-height:0;padding:12px 12px 10px;box-shadow:0 8px 24px #0c251b18}
  .admin-side>img{width:48px;height:48px;border-radius:14px;margin:0 auto 5px}
  .admin-side>small{margin:0 0 8px}
  .admin-side>small:before{font-size:17px}
  .admin-side nav{display:flex;gap:6px;overflow-x:auto;overscroll-behavior-inline:contain;padding:4px 1px 8px;scrollbar-width:thin}
  .admin-side nav button{flex:0 0 auto;white-space:nowrap;min-height:40px;padding:9px 12px}
  .admin-logout{margin:5px 0 0;min-height:40px}
  .admin-main{padding:20px 13px calc(24px + env(safe-area-inset-bottom))}
  .admin-main header{align-items:flex-start;flex-wrap:wrap;margin-bottom:18px;padding-bottom:15px}
  .admin-user{width:100%;justify-content:space-between;overflow-wrap:anywhere}
  .admin-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
}
@media(max-width:420px){
  .ref-drawer{padding-bottom:calc(18px + env(safe-area-inset-bottom))}
  .ref-checkout-form input,.ref-checkout-form textarea,.ref-auth-form input{font-size:16px}
}
@media(prefers-reduced-motion:reduce){
  :root{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
